name: CI

on:
  pull_request:
  push:
    # main, plus milestone branches (m1-…, m2-…, m3-…) so stacked milestone work is checked before a PR exists
    branches: [main, "m[0-9]*"]

permissions:
  contents: read
  pull-requests: write # temporary: posts the schema SQL for the first migration

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: privateconnet_migrate
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: privateconnet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U privateconnet_migrate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only values. Real keys live only on the server.
      DATABASE_URL: postgresql://privateconnet_migrate:ci-only@localhost:5432/privateconnet
      DATABASE_MIGRATE_URL: postgresql://privateconnet_migrate:ci-only@localhost:5432/privateconnet
      APP_ORIGIN: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:3000
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BLIND_INDEX_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      MEDIA_SIGNING_KEY: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
      MEDIA_ROOT: /tmp/media
      SUPPORT_PHONE: "+231778104168"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate database schema
        run: npx prisma validate
      - name: Export full schema SQL (used to create and check migrations)
        run: npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > schema-from-empty.sql
      - name: Post schema SQL to the pull request (temporary, until the first migration exists)
        if: github.event_name == 'pull_request' && hashFiles('prisma/migrations/migration_lock.toml') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- schema-sql -->'; echo '```sql'; cat schema-from-empty.sql; echo '```'; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file comment.md
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Check migrations match the schema (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed countries and cities
        run: npm run db:seed
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
      - name: Build
        run: npm run build
